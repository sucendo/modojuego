<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>F-22 Raptor · Misión 001</title>

  <link rel="preconnect" href="https://api.mapbox.com">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css">
  <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script defer src="js/plane.js"></script>

  <style>
    html, body, #game-shell, #map, #game { width: 100%; height: 100%; }
    html, body { margin: 0; overflow: hidden; background: #07111f; }
    body { font-family: 'Arial Black', Impact, Arial, sans-serif; user-select: none; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #game-shell { position: fixed; inset: 0; width: 100dvw; height: 100dvh; }
    #map { position: absolute; inset: 0; }
    #game { position: absolute; inset: 0; z-index: 2; }

    /* La cartografía queda detrás del juego, pero la atribución legal de Mapbox
       permanece visible y compacta sobre el canvas. */
    #map .mapboxgl-control-container {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    #map .mapboxgl-ctrl-bottom-right { right: 4px; bottom: 3px; }
    #map .mapboxgl-ctrl-attrib,
    #map .mapboxgl-ctrl-logo {
      pointer-events: auto;
    }
    #map .mapboxgl-ctrl-attrib.mapboxgl-compact {
      margin: 0 0 2px 0;
      background: rgba(3, 12, 18, .62);
      color: rgba(255,255,255,.82);
    }
    #game canvas { display: block; width: 100%; height: 100%; background: transparent; }
    #game-shell::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(110,235,255,.025) 0 1px, transparent 1px 4px),
        radial-gradient(circle at center, transparent 58%, rgba(0,0,0,.22) 100%);
    }
  </style>
</head>
<body>
  <main id="game-shell">
    <div id="map" aria-hidden="true"></div>
    <div id="game"></div>
  </main>
</body>
</html>
