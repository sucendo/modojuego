name: Hexategos mobilization browser audit

on:
  push:
    branches:
      - feat/hexategos-movilizacion-03892-20261014
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-browser-03892.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated Playwright browser
        run: |
          mkdir -p /tmp/hx-playwright
          npm install --prefix /tmp/hx-playwright --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/hx-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hexategos-browser.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8765/hexategos/index.html > /dev/null
      - name: Verify real game mobilization and persistence in Chromium
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/hx-playwright/node_modules
          HEX_TEST_URL: http://127.0.0.1:8765/hexategos/
        run: node hexategos/tests/browser-mobilization-03892.cjs
