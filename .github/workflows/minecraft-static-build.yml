name: Build Minecraft static publication
on:
  push:
    branches: ['minecraft/build-11.8.2-publication']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: minecraft/source/package-lock.json
      - name: Verify and compile
        working-directory: minecraft/source
        run: |
          npm ci
          npm test
          npm run build
          cp -a dist/. ../
          rm -rf node_modules dist
      - name: Commit verified static files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft/
          git diff --cached --quiet && exit 0
          git commit -m 'build(minecraft): publish verified 11.8.2 static files'
          git push origin HEAD:refs/heads/minecraft/build-11.8.2-publication
