name: Hexategos Systems focus and scroll browser

on:
  push:
    branches:
      - fix/hexategos-systems-live-03893-20261014
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-systems-03893.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real game test
        run: |
          mkdir -p /tmp/hx-playwright
          npm install --prefix /tmp/hx-playwright --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/hx-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve real Hexategos
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hexategos-systems-browser.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8765/hexategos/index.html > /dev/null
      - name: Exercise Systems tabs, focus and scroll in Chromium
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/hx-playwright/node_modules
          HEX_TEST_URL: http://127.0.0.1:8765/hexategos/
        run: node hexategos/tests/browser-systems-live-03893.cjs
