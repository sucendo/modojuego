name: SonusArca Android · Compilar y publicar APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible (ej. 8.1)"
        required: true
        default: "8.1"
        type: string
      version_code:
        description: "Código Android entero y creciente (ej. 801)"
        required: true
        default: "801"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Generar SonusArca.apk firmado
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sonusarca-android

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Comprobar secretos de firma
        env:
          SONUSARCA_KEYSTORE_BASE64: ${{ secrets.SONUSARCA_KEYSTORE_BASE64 }}
          SONUSARCA_KEYSTORE_PASSWORD: ${{ secrets.SONUSARCA_KEYSTORE_PASSWORD }}
          SONUSARCA_KEY_ALIAS: ${{ secrets.SONUSARCA_KEY_ALIAS }}
          SONUSARCA_KEY_PASSWORD: ${{ secrets.SONUSARCA_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$SONUSARCA_KEYSTORE_BASE64" || { echo "::error::Falta el secret SONUSARCA_KEYSTORE_BASE64"; exit 1; }
          test -n "$SONUSARCA_KEYSTORE_PASSWORD" || { echo "::error::Falta el secret SONUSARCA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SONUSARCA_KEY_ALIAS" || { echo "::error::Falta el secret SONUSARCA_KEY_ALIAS"; exit 1; }
          test -n "$SONUSARCA_KEY_PASSWORD" || { echo "::error::Falta el secret SONUSARCA_KEY_PASSWORD"; exit 1; }

      - name: Restaurar clave privada de firma
        env:
          SONUSARCA_KEYSTORE_BASE64: ${{ secrets.SONUSARCA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          printf '%s' "$SONUSARCA_KEYSTORE_BASE64" | base64 --decode > signing/sonusarca-release.jks
          chmod 600 signing/sonusarca-release.jks

      - name: Compilar APK release firmado
        env:
          SONUSARCA_VERSION_NAME: ${{ inputs.version_name }}
          SONUSARCA_VERSION_CODE: ${{ inputs.version_code }}
          SONUSARCA_KEYSTORE_PATH: ${{ github.workspace }}/sonusarca-android/signing/sonusarca-release.jks
          SONUSARCA_KEYSTORE_PASSWORD: ${{ secrets.SONUSARCA_KEYSTORE_PASSWORD }}
          SONUSARCA_KEY_ALIAS: ${{ secrets.SONUSARCA_KEY_ALIAS }}
          SONUSARCA_KEY_PASSWORD: ${{ secrets.SONUSARCA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Preparar archivo descargable
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SonusArca.apk
          sha256sum dist/SonusArca.apk | sed 's#dist/##' > dist/SonusArca.apk.sha256

      - name: Guardar APK como artifact de Actions
        uses: actions/upload-artifact@v7
        with:
          name: SonusArca-Android-${{ inputs.version_name }}
          path: |
            sonusarca-android/dist/SonusArca.apk
            sonusarca-android/dist/SonusArca.apk.sha256
          if-no-files-found: error

      - name: Crear o actualizar Release estable de SonusArca
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -e
          TAG="sonusarca-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "SonusArca Android ${VERSION_NAME}" \
              --notes "APK personal de SonusArca · versión ${VERSION_NAME} (${VERSION_CODE}). Este tag se mantiene fijo para que la web tenga un enlace de descarga estable."
          else
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "SonusArca Android ${VERSION_NAME}" \
              --notes "APK personal de SonusArca · versión ${VERSION_NAME} (${VERSION_CODE}). Este tag se mantiene fijo para que la web tenga un enlace de descarga estable." \
              --latest=false
          fi
          gh release upload "$TAG" \
            sonusarca-android/dist/SonusArca.apk \
            sonusarca-android/dist/SonusArca.apk.sha256 \
            --clobber

      - name: Resumen
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## SonusArca Android listo"
            echo ""
            echo "- Versión: ${{ inputs.version_name }}"
            echo "- Version code: ${{ inputs.version_code }}"
            echo "- APK: https://github.com/${{ github.repository }}/releases/download/sonusarca-latest/SonusArca.apk"
          } >> "$GITHUB_STEP_SUMMARY"
