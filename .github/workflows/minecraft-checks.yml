name: Minecraft stability checks
on:
  pull_request:
    paths:
      - 'minecraft/source/**'
      - '.github/workflows/minecraft-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: minecraft/source/package-lock.json
      - run: npm ci
      - name: Cavity regression
        run: node --test tests/waterEnvironmentV1150.test.mjs
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-11.8.2-preview
          path: minecraft/source/dist/
