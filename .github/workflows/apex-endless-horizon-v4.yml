name: APEX Endless Horizon V4 - seamless music preview

on:
  push:
    branches:
      - apex/endless-dream-v4-20261027
    paths:
      - apex/scripts/create-endless-horizon-v4.cjs
      - .github/workflows/apex-endless-horizon-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install codec tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Validate generator and source
        run: |
          node --check apex/scripts/create-endless-horizon-v4.cjs
          node --check apex/assets/soundbox/apex-song01.js
          test -s apex/assets/music/apex-theme.mp3
      - name: Render extended dream trance soundtrack
        run: node --max-old-space-size=1700 apex/scripts/create-endless-horizon-v4.cjs
      - name: Validate final length and untouched original
        run: |
          python3 - <<'PY'
          import os, subprocess
          def seconds(file):
            return float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",file], text=True).strip())
          original="apex/assets/music/apex-theme.mp3"
          remix="apex/assets/music/apex-theme-v4-endless-horizon.mp3"
          assert 251<seconds(original)<254
          assert 489<seconds(remix)<492
          assert os.stat(remix).st_size>4_000_000
          print("Original:",seconds(original),"s")
          print("Seamless V4:",seconds(remix),"s")
          PY
          test -z "$(git status --porcelain -- apex/assets/music/apex-theme.mp3 apex/js/menu-music-9a.js)"
      - name: Commit audio candidate only on preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex/assets/music/apex-theme-v4-endless-horizon.mp3
          if ! git diff --cached --quiet; then
            git commit -m "APEX: preview Endless Horizon V4 eight-minute seamless mix"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
