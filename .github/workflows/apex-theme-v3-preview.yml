name: APEX V3 Race Remix preview

on:
  push:
    branches: ["apex/theme-v3-race-remix-20261026"]
    paths:
      - "apex/scripts/remix-apex-theme-v3.cjs"
      - ".github/workflows/apex-theme-v3-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ffmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Check input and syntax
        run: |
          node --check apex/scripts/remix-apex-theme-v3.cjs
          node --check apex/assets/soundbox/apex-song01.js
          test -s apex/assets/music/apex-theme.mp3
      - name: Render V3 with audible new stems, offline
        run: node --max-old-space-size=1200 apex/scripts/remix-apex-theme-v3.cjs
      - name: Validate result and non-destructive preview
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          for(const f of ['apex/assets/music/apex-theme.mp3','apex/assets/music/apex-theme-v3-race-remix.mp3']){
            const duration=Number(cp.execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',f],{encoding:'utf8'}).trim());
            const size=fs.statSync(f).size;
            if(duration<251||duration>254||size<2e6)throw Error('Invalid audio '+f+' duration='+duration+' size='+size);
            console.log(f, duration, 's', size, 'bytes');
          }
          NODE
          test -z "$(git status --porcelain -- apex/assets/music/apex-theme.mp3 apex/js/menu-music-9a.js)"
      - name: Publish remix only on preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex/assets/music/apex-theme-v3-race-remix.mp3
          if ! git diff --cached --quiet; then
            git commit -m "APEX: Race Remix V3 audio candidate (not live)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
