name: APEX driving and browser regressions

on:
  pull_request:
    paths: ['apex/**', '.github/workflows/apex-audit.yml']
  push:
    branches: [main]
    paths: ['apex/**', '.github/workflows/apex-audit.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apex
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SVG concrete F1 catch fence (preview only)
        run: node apex/tests/svg-concrete-f1-fence-preview.cjs
      - name: Grandstand v2 architecture and crowd LOD (preview only)
        run: node apex/tests/grandstand-v2-preview.cjs
      - name: Grandstand crowd LOD and cache (preview only)
        run: node apex/tests/grandstand-crowd-perf6a-preview.cjs
      - name: Grandstand v5 hybrid atlas texturing (preview only)
        run: node apex/tests/grandstand-texture-v5-preview.cjs
      - name: Asphalt V15.1 SVG material and colour groups (preview only)
        run: node apex/tests/asphalt-material-v15-preview.cjs
      - name: Asphalt V15.1.1 per-fragment GPU material (preview only)
        run: node apex/tests/asphalt-fragment-v151-preview.cjs
      - name: Full SVG pedestrian bridges (preview only)
        run: node apex/tests/pedestrian-bridge-fullspan-preview.cjs
      - name: Mobile trees 3D preview option (isolated)
        run: node apex/tests/trees3d-mobile-preview.cjs
      - name: Production function and asset regressions
        run: |
          mkdir -p /tmp/apex-results
          node apex/tests/render-audit.cjs > /tmp/apex-results/render.txt
          node apex/tests/track-sponsors-audit.cjs > /tmp/apex-results/sponsor-master.json
          node apex/tests/feature-sponsor-audit.cjs > /tmp/apex-results/sponsor-feature.json
          node apex/tests/madrid-saved-svg.cjs > /tmp/apex-results/madrid-saved-svg.json
          node apex/tests/svg-barrier-visibility.cjs > /tmp/apex-results/svg-barrier-visibility.json
          node apex/tests/svg-metric-scale.cjs > /tmp/apex-results/svg-metric-scale.json
          node apex/tests/pedestrian-bridge-clearance.cjs > /tmp/apex-results/pedestrian-bridge-clearance.json
          node apex/tests/trees3d-universal.cjs > /tmp/apex-results/trees3d-universal.json
          node apex/tests/svg-ideal-racing-line.cjs > /tmp/apex-results/svg-ideal-racing-line.json
          node apex/tests/svg-curbs-audit.cjs > /tmp/apex-results/svg-curbs-palette.json
          node apex/tests/track-curve-geometry.cjs > /tmp/apex-results/track-curves.json
          node apex/tests/circuit-extra-catalog-audit.cjs > /tmp/apex-results/extra-catalog.json
          node apex/tests/madrid-json-banking-audit.cjs > /tmp/apex-results/madrid-json-banking.json
          node apex/tests/sponsor-render-stability.cjs > /tmp/apex-results/sponsor-stability.json
          node apex/tests/urban-distance-boards.cjs > /tmp/apex-results/distance-boards.json
          python3 apex/tests/pit-geometry-audit.py > /tmp/apex-results/pit-geometry.json
          node apex/tests/track-preview-isolation.cjs > /tmp/apex-results/preview-isolation.json
          node apex/tests/race-distance-audit.cjs > /tmp/apex-results/race-distance.json
          node apex/tests/pit-tyres-audit.cjs > /tmp/apex-results/pit-tyres.json
          node apex/tests/rival-pit-request-audit.cjs > /tmp/apex-results/rival-pit-request.txt
          node apex/tests/rival-tyre-strategy-audit.cjs > /tmp/apex-results/rival-tyre-strategy.txt
          node apex/tests/rival-pit-traversal-audit.cjs > /tmp/apex-results/rival-pit-traversal.txt
          node apex/tests/tyres-audit.cjs > /tmp/apex-results/tyres.json
          node apex/tests/driving-audit.cjs --json > /tmp/apex-results/driving.json
          node apex/tests/terrain-selection-audit.cjs > /tmp/apex-results/terrain-selection.json
          node apex/tests/auto-boundary-audit.cjs > /tmp/apex-results/auto-boundary.txt
          node apex/tests/autopilot-grip-audit.cjs > /tmp/apex-results/autopilot-grip.json
          node apex/tests/aut-10c-path-control.cjs > /tmp/apex-results/aut-10c-path-control.json
          node apex/tests/aut-11-svg-follow.cjs > /tmp/apex-results/aut-11-svg-follow.json
          node apex/tests/aut-12-kerb-chicane.cjs > /tmp/apex-results/aut-12-kerb-chicane.json
          node apex/tests/aut-13-svg-pace.cjs > /tmp/apex-results/aut-13-svg-pace.json
          node apex/tests/autopilot-trajectory-preview.cjs > /tmp/apex-results/autopilot-trajectory-preview.json
          node apex/tests/autopilot-madrid-pk1150-reference.cjs > /tmp/apex-results/autopilot-madrid-pk1150-reference.json
          node apex/tests/autopilot-pace-analysis.cjs > /tmp/apex-results/autopilot-pace-analysis.json
          node apex/tests/autopilot-clean-exit.cjs > /tmp/apex-results/autopilot-clean-exit.json
          node apex/tests/autopilot-time-optimal-line.cjs > /tmp/apex-results/autopilot-time-optimal-line.json
          python3 apex/tests/circuit-assets-audit.py --json > /tmp/apex-results/assets.json
          node --check apex/js/preparation-9a.js
          node apex/tests/climate-9a-audit.cjs
          node --check apex/js/competition-flows-9a.js
          node --check apex/js/menu-music-9a.js
          node --check apex/tests/competition-flows-9a-browser.cjs
          node --check apex/tests/preparation-9a-browser.cjs
          node --check apex/tests/browser-audit.cjs
          node --check apex/tests/browser-hook.js
          node --check apex/tests/extra-circuits-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-isolated
          path: /tmp/apex-results/

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apex
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/apex-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/apex-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Asphalt V15.1.1 — verify visible WebGL pixels (preview only)
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/apex-browser/node_modules/playwright
          APEX_AUDIT_DEVICE: ${{ matrix.device }}
        run: node apex/tests/asphalt-fragment-v151-browser.cjs
      - name: Drive complete circuits in Chromium with software WebGL
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/apex-browser/node_modules/playwright
          APEX_AUDIT_DEVICE: ${{ matrix.device }}
          SOFTWARE_GL: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-results
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/apex-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/apex/apex.html > /dev/null; then break; fi
            sleep 1
          done
          node apex/tests/madrid-saved-svg-browser.cjs 2>&1 | tee /tmp/apex-results/madrid-saved-svg-browser.jsonl
          node apex/tests/sponsor-textures-browser.cjs 2>&1 | tee /tmp/apex-results/sponsor-textures-browser.jsonl
          APEX_AUDIT_CITY_ONLY=1 node apex/tests/urban-distance-boards-browser.cjs 2>&1 | tee /tmp/apex-results/urban-distance-boards-browser.jsonl
          node apex/tests/preparation-9a-browser.cjs 2>&1 | tee /tmp/apex-results/preparation-9a.jsonl
          node apex/tests/competition-flows-9a-browser.cjs 2>&1 | tee /tmp/apex-results/competition-flows-9a.jsonl
          APEX_PIT_RESULTS=/tmp/apex-results/pits node apex/tests/pit-tyres-browser.cjs 2>&1 | tee /tmp/apex-results/pit-browser.jsonl
          APEX_RACE_RESULTS=/tmp/apex-results/races node apex/tests/race-distance-browser.cjs 2>&1 | tee /tmp/apex-results/race-browser.jsonl
          node apex/tests/rival-pit-browser.cjs 2>&1 | tee /tmp/apex-results/rival-pit-browser.jsonl
          node apex/tests/browser-audit.cjs 2>&1 | tee /tmp/apex-results/browser.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-chromium-${{ matrix.device }}
          path: /tmp/apex-results/

  extra-circuit-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        group: [first, second]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apex
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium for extra circuits
        run: |
          npm install --prefix "$RUNNER_TEMP/apex-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/apex-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Load all eight extra circuits in six session types
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/apex-browser/node_modules/playwright
          APEX_AUDIT_DEVICE: ${{ matrix.device }}
          APEX_EXTRA_SET: ${{ matrix.group }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-extra-results
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/apex-extra-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/apex/apex.html > /dev/null; then break; fi
            sleep 1
          done
          node apex/tests/extra-circuits-browser.cjs 2>&1 | tee /tmp/apex-extra-results/extra-browser.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-extra-${{ matrix.device }}-${{ matrix.group }}
          path: /tmp/apex-extra-results/
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apex
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/apex-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/apex-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare automatic driving with main
        env:
          # Compare against the current PR base, not the old phase-7 snapshot.
          BASELINE_REF: ${{ github.event.pull_request.base.sha || '917a262228299b0fb4b3db6c488cbc32a0f8e3cb' }}
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/apex-browser/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-auto-results
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/apex-auto-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/apex/apex.html > /dev/null; then break; fi
            sleep 1
          done
          # Run both diagnostics even when one fails. The Madrid endurance
          # report must not be hidden behind a regression on another circuit.
          overall_status=0
          node apex/tests/autopilot-audit.cjs 2>&1 | tee /tmp/apex-auto-results/autopilot.jsonl || overall_status=1
          madrid_status=0
          # Measure a complete flying Madrid lap where pace allows; same authored SVG on both variants.
          APEX_AUTO_CIRCUITS=14-spain APEX_AUTO_TRAFFIC=solo APEX_AUTO_SECONDS=390 node apex/tests/autopilot-audit.cjs 2>&1 | tee /tmp/apex-auto-results/madrid-solo-390s.jsonl || madrid_status=1
          node apex/tests/autopilot-time-compare.cjs /tmp/apex-auto-results/madrid-solo-390s.jsonl 2>&1 | tee /tmp/apex-auto-results/madrid-time-comparison.jsonl || madrid_status=1
          practice_status=0
          # Reproduce the user's specific FREE PRACTICE crash at s=1150–1170.
          # Run physics at 100 Hz, but group heavy frames in 12 ticks (~8.3 FPS).
          APEX_AUTO_CIRCUITS=14-spain APEX_AUTO_TRAFFIC=solo APEX_AUTO_SESSION=freepractice APEX_AUTO_STEPS_PER_FRAME=12 APEX_AUTO_SECONDS=120 node apex/tests/autopilot-audit.cjs 2>&1 | tee /tmp/apex-auto-results/madrid-freepractice-pk1150.jsonl || practice_status=1
          echo "AUT comparison: $overall_status · Madrid endurance: $madrid_status · Freepractice PK1150: $practice_status"
          if (( overall_status != 0 || madrid_status != 0 || practice_status != 0 )); then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-autopilot-comparison
          path: /tmp/apex-auto-results/
