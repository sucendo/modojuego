name: APEX driving and browser regressions

on:
  pull_request:
    paths: ['apex/**', '.github/workflows/apex-audit.yml']
  push:
    branches: [main]
    paths: ['apex/**', '.github/workflows/apex-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apex
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production function and asset regressions
        run: |
          mkdir -p /tmp/apex-results
          node apex/tests/render-audit.cjs > /tmp/apex-results/render.txt
          python3 apex/tests/pit-geometry-audit.py > /tmp/apex-results/pit-geometry.json
          node apex/tests/race-distance-audit.cjs > /tmp/apex-results/race-distance.json
          node apex/tests/pit-tyres-audit.cjs > /tmp/apex-results/pit-tyres.json
          node apex/tests/tyres-audit.cjs > /tmp/apex-results/tyres.json
          node apex/tests/driving-audit.cjs --json > /tmp/apex-results/driving.json
          node apex/tests/terrain-selection-audit.cjs > /tmp/apex-results/terrain-selection.json
          node apex/tests/auto-boundary-audit.cjs > /tmp/apex-results/auto-boundary.txt
          python3 apex/tests/circuit-assets-audit.py --json > /tmp/apex-results/assets.json
          node --check apex/tests/browser-audit.cjs
          node --check apex/tests/browser-hook.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-isolated
          path: /tmp/apex-results/

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apex
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/apex-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/apex-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Drive complete circuits in Chromium with software WebGL
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/apex-browser/node_modules/playwright
          APEX_AUDIT_DEVICE: ${{ matrix.device }}
          SOFTWARE_GL: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-results
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/apex-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/apex/apex.html > /dev/null; then break; fi
            sleep 1
          done
          APEX_PIT_RESULTS=/tmp/apex-results/pits node apex/tests/pit-tyres-browser.cjs 2>&1 | tee /tmp/apex-results/pit-browser.jsonl
          node apex/tests/race-distance-browser.cjs 2>&1 | tee /tmp/apex-results/race-browser.jsonl
          node apex/tests/browser-audit.cjs 2>&1 | tee /tmp/apex-results/browser.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-chromium-${{ matrix.device }}
          path: /tmp/apex-results/

  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apex
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/apex-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/apex-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare automatic driving with main
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/apex-browser/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-auto-results
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/apex-auto-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/apex/apex.html > /dev/null; then break; fi
            sleep 1
          done
          node apex/tests/autopilot-audit.cjs 2>&1 | tee /tmp/apex-auto-results/autopilot.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-autopilot-comparison
          path: /tmp/apex-auto-results/
