name: Hexategos smoke

on:
  push:
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-smoke.yml'
  pull_request:
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Hexategos 0.34.2 stability smoke
        run: node hexategos/tests/smoke-0342.mjs
      - name: Run Hexategos 0.35 geopolitical smoke
        run: node hexategos/tests/smoke-035.mjs
      - name: Run Hexategos 0.35.1 About smoke
        run: node hexategos/tests/smoke-0351.mjs
      - name: Run Hexategos 0.35.2 geopolitical map smoke
        run: node hexategos/tests/smoke-0352.mjs
      - name: Run Hexategos 0.35.3 movable panels smoke
        run: node hexategos/tests/smoke-0353.mjs
      - name: Run Hexategos 0.35.4 real cities smoke
        run: node hexategos/tests/smoke-0354.mjs
      - name: Run Hexategos 0.35.6 AI and infrastructure smoke
        run: node hexategos/tests/smoke-0356.mjs
      - name: Run Hexategos 0.36.0 native 500-nation adaptive AI smoke
        run: node hexategos/tests/smoke-0360.mjs
      - name: Run Hexategos 0.36.1 500-nation performance smoke
        run: node hexategos/tests/smoke-0361.mjs

      - name: Run Hexategos 0.36.2 human-like AI construction smoke
        run: node hexategos/tests/smoke-0362.mjs

      - name: Run Hexategos 0.37.0 physical trade and naval logistics smoke
        run: node hexategos/tests/smoke-0370.mjs

      - name: Run Hexategos 0.37.1 domestic traffic and visible naval movement smoke
        run: node hexategos/tests/smoke-0371.mjs

      - name: Run Hexategos 0.37.2 traffic visibility and patrol route smoke
        run: node hexategos/tests/smoke-0372.mjs

      - name: Run Hexategos 0.37.3 isolated infrastructure decay smoke
        run: node hexategos/tests/smoke-0373.mjs

      - name: Run Hexategos 0.37.4 road removal smoke
        run: node hexategos/tests/smoke-0374.mjs
