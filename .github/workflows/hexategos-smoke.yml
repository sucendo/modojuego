name: Hexategos smoke

on:
  push:
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-smoke.yml'
  pull_request:
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Hexategos 0.34.2 stability smoke
        run: node hexategos/tests/smoke-0342.mjs
      - name: Run Hexategos 0.35 geopolitical smoke
        run: node hexategos/tests/smoke-035.mjs
      - name: Run Hexategos 0.35.1 About smoke
        run: node hexategos/tests/smoke-0351.mjs
      - name: Run Hexategos 0.35.2 geopolitical map smoke
        run: node hexategos/tests/smoke-0352.mjs
      - name: Run Hexategos 0.35.3 movable panels smoke
        run: node hexategos/tests/smoke-0353.mjs
      - name: Run Hexategos 0.35.4 real cities smoke
        run: node hexategos/tests/smoke-0354.mjs
      - name: Run Hexategos 0.35.6 AI and infrastructure smoke
        run: node hexategos/tests/smoke-0356.mjs
      - name: Run Hexategos 0.35.7 minor polities smoke
        run: node hexategos/tests/smoke-0357.mjs
      - name: Run Hexategos 0.35.8 unified political entities smoke
        run: node hexategos/tests/smoke-0358.mjs
      - name: Run Hexategos 0.35.9 universal political entities smoke
        run: node hexategos/tests/smoke-0359.mjs
      - name: Run Hexategos 0.36.0 adaptive political evolution smoke
        run: node hexategos/tests/smoke-0360.mjs
