name: Hexategos stability checks

on:
  push:
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-smoke.yml'
  pull_request:
    paths:
      - 'hexategos/**'
      - '.github/workflows/hexategos-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of all Hexategos JS modules
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            node --check "$file"
            count=$((count+1))
          done < <(find hexategos/js -maxdepth 1 -type f -name '*.js' | sort -V)
          echo "Syntax checked: $count files"
          test "$count" -ge 30
      - name: Run every Hexategos smoke test
        shell: bash
        run: |
          set -euo pipefail
          count=0
          failed=0
          while IFS= read -r file; do
            echo "::group::$(basename "$file")"
            if node "$file"; then
              echo "PASS $file"
            else
              echo "::error file=$file::Regression smoke failed"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
            count=$((count+1))
          done < <(find hexategos/tests -maxdepth 1 -type f -name 'smoke-*.mjs' | sort -V)
          echo "Smoke tests executed: $count; failed: $failed"
          test "$count" -ge 50
          test "$failed" -eq 0
