<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX Formula 26</title>
<style>
html,body{margin:0;min-height:100%;background:#090d12;color:#e8eef5;font:16px system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
small{display:block;color:#91a0af;margin-top:10px}
</style>
</head>
<body>
<main id="status"><div><strong>Cargando APEX Formula 26…</strong><small>Reconstruyendo la versión completa.</small></div></main>
<script type="module">
const count=28;
try{
  // Fase 4: descarga concurrente acotada, ensamblado en orden estable.
  // Evita 28 esperas HTTP secuenciales y concatenaciones crecientes.
  const parts=new Array(count);
  let cursor=0;
  async function loadPartWorker(){
    for(;;){
      const i=cursor++;
      if(i>=count)return;
      const n=String(i).padStart(3,"0");
      const r=await fetch("parts/part-"+n+".txt",{cache:"no-cache"});
      if(!r.ok)throw new Error("No se pudo cargar part-"+n+" ("+r.status+")");
      parts[i]=await r.text();
    }
  }
  await Promise.all(Array.from({length:Math.min(4,count)},()=>loadPartWorker()));
  document.open();
  document.write(parts.join(""));
  document.close();
  // Cargar el estado 9A después de reconstruir el documento completo.
  // No insertar etiquetas de script en el HTML ensamblado durante document.write.
  const moduleScript=document.createElement("script");
  moduleScript.src="js/competition-9a.js";
  moduleScript.async=false; // Mantener orden de módulos 9A tras document.write.
  (document.body||document.head).appendChild(moduleScript);
  const menuStyles=document.createElement("link");
  menuStyles.rel="stylesheet";
  menuStyles.href="css/menu-9a.css";
  (document.head||document.body).appendChild(menuStyles);
  const menuScript=document.createElement("script");
  menuScript.src="js/menu-9a.js";
  menuScript.async=false;
  (document.body||document.head).appendChild(menuScript);
  const preparationStyles=document.createElement("link");
  preparationStyles.rel="stylesheet";
  preparationStyles.href="css/preparation-9a.css";
  (document.head||document.body).appendChild(preparationStyles);
  const preparationScript=document.createElement("script");
  preparationScript.src="js/preparation-9a.js";
  preparationScript.async=false;
  (document.body||document.head).appendChild(preparationScript);
  const climateScript=document.createElement("script");
  climateScript.src="js/climate-9a.js";
  climateScript.async=false;
  (document.body||document.head).appendChild(climateScript);
  const competitionStyles=document.createElement("link");
  competitionStyles.rel="stylesheet";
  competitionStyles.href="css/competition-flows-9a.css";
  (document.head||document.body).appendChild(competitionStyles);
  const competitionScript=document.createElement("script");
  competitionScript.src="js/competition-flows-9a.js";
  competitionScript.async=false;
  (document.body||document.head).appendChild(competitionScript);
  const musicScript=document.createElement("script");
  musicScript.src="js/menu-music-9a.js";
  musicScript.async=false;
  (document.body||document.head).appendChild(musicScript);
  // 9A.8 · Fachada aprobada del ZIP: navegación separada de carreras y opciones.
  const prototypeStyles=document.createElement("link");
  prototypeStyles.rel="stylesheet";
  prototypeStyles.href="css/menu-prototype-9a.css";
  (document.head||document.body).appendChild(prototypeStyles);
  const prototypeScript=document.createElement("script");
  prototypeScript.src="js/menu-prototype-9a.js";
  prototypeScript.async=false;
  (document.body||document.head).appendChild(prototypeScript);
  // Tarjeta broadcast de Circuito: información nativa, trazado SVG real y controles intactos.
  const circuitBroadcastStyles=document.createElement("link");
  circuitBroadcastStyles.rel="stylesheet";
  circuitBroadcastStyles.href="css/circuit-broadcast-9a.css";
  (document.head||document.body).appendChild(circuitBroadcastStyles);
  const circuitBroadcastScript=document.createElement("script");
  circuitBroadcastScript.src="js/circuit-broadcast-9a.js";
  circuitBroadcastScript.async=false;
  (document.body||document.head).appendChild(circuitBroadcastScript);
  // 9F.1 · Perfil de piloto: identidad propia y casco SVG personalizable.
  const driverProfileStyles=document.createElement("link");
  driverProfileStyles.rel="stylesheet";
  driverProfileStyles.href="css/driver-profile-9f.css";
  (document.head||document.body).appendChild(driverProfileStyles);
  const driverProfileScript=document.createElement("script");
  driverProfileScript.src="js/driver-profile-9f.js";
  driverProfileScript.async=false;
  (document.body||document.head).appendChild(driverProfileScript);
  // 9F.2 · Personalización SVG del mono y avatar, coordinada con el casco.
  const driverAppearanceStyles=document.createElement("link");
  driverAppearanceStyles.rel="stylesheet";
  driverAppearanceStyles.href="css/driver-appearance-9f.css";
  (document.head||document.body).appendChild(driverAppearanceStyles);
  const driverAppearanceScript=document.createElement("script");
  driverAppearanceScript.src="js/driver-appearance-9f.js";
  driverAppearanceScript.async=false;
  (document.body||document.head).appendChild(driverAppearanceScript);
  // 9A.9 · Preparación fiel al prototipo; se carga sobre ambos flujos 9A existentes.
  const briefingStyles=document.createElement("link");
  briefingStyles.rel="stylesheet";
  briefingStyles.href="css/briefing-prototype-9a.css";
  (document.head||document.body).appendChild(briefingStyles);
  const briefingScript=document.createElement("script");
  briefingScript.src="js/briefing-prototype-9a.js";
  briefingScript.async=false;
  (document.body||document.head).appendChild(briefingScript);
  // 9B: módulos de preparación por sesión, una vez instalados los menús 9A.9.
  for(const src of ["js/session-plans-9b.js","js/session-preparation-9b.js"]){
    const script=document.createElement("script");script.src=src;script.async=false;
    (document.body||document.head).appendChild(script);
  }
  const sessionStyle=document.createElement("link");
  sessionStyle.rel="stylesheet";sessionStyle.href="css/session-preparation-9b.css";
  (document.head||document.body).appendChild(sessionStyle);
}catch(err){
  document.getElementById("status").innerHTML="<div><strong>No se pudo cargar APEX.</strong><small>"+String(err.message||err)+"</small></div>";
  console.error(err);
}
</script>
</body>
</html>
