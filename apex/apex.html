<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX Formula 26</title>
<style>
html,body{margin:0;min-height:100%;background:#090d12;color:#e8eef5;font:16px system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
small{display:block;color:#91a0af;margin-top:10px}
</style>
</head>
<body>
<main id="status"><div><strong>Cargando APEX Formula 26…</strong><small>Reconstruyendo la versión completa.</small></div></main>
<script type="module">
const count=28;
try{
  // Fase 4: descarga concurrente acotada, ensamblado en orden estable.
  // Evita 28 esperas HTTP secuenciales y concatenaciones crecientes.
  const parts=new Array(count);
  let cursor=0;
  async function loadPartWorker(){
    for(;;){
      const i=cursor++;
      if(i>=count)return;
      const n=String(i).padStart(3,"0");
      const r=await fetch("parts/part-"+n+".txt",{cache:"no-cache"});
      if(!r.ok)throw new Error("No se pudo cargar part-"+n+" ("+r.status+")");
      parts[i]=await r.text();
    }
  }
  await Promise.all(Array.from({length:Math.min(4,count)},()=>loadPartWorker()));
  document.open();
  document.write(parts.join(""));
  document.close();
}catch(err){
  document.getElementById("status").innerHTML="<div><strong>No se pudo cargar APEX.</strong><small>"+String(err.message||err)+"</small></div>";
  console.error(err);
}
</script>
</body>
</html>
